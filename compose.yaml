name: jack-en-poy

services:
  web:
    build:
      context: .
      dockerfile: web/jack-en-poy-ai/Dockerfile
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8088}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 128m
    networks: [game, entry]

  backend:
    build:
      context: .
      dockerfile: core/jack-en-poy-ai/Dockerfile
    environment:
      ML_SERVICE_URL: http://ml:8001
      GAME_HISTORY_PATH: /data/history/live-history.csv
      GAME_ALLOWED_ORIGINS: ${GAME_ALLOWED_ORIGINS:-http://localhost:8088,http://127.0.0.1:8088}
    volumes:
      - history:/data/history
    depends_on:
      ml:
        condition: service_started
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 768m
    networks: [game]

  ml:
    build:
      context: .
      dockerfile: ml/Dockerfile
    volumes:
      - models:/app/models
      - reports:/app/reports
      - history:/data/history:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 1g
    networks: [game]

networks:
  entry:
  game:
    internal: true
volumes:
  history:
  models:
  reports:
