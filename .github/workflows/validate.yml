name: Validate

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/jack-en-poy-ai/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements-lock.txt
      - name: Install Python dependencies
        run: python -m pip install -r ml/requirements-lock.txt
      - name: Validate Python pipeline
        working-directory: ml
        run: |
          python -m pytest
          python -m src.dataset.main
          python train.py
          python predict.py ROCK PAPER SCISSORS
          python compare.py
          python retrain.py --history data/raw/game-history.csv --compare
          python analytics.py --history data/raw/game-history.csv
      - name: Validate and package backend
        working-directory: core/jack-en-poy-ai
        run: sh mvnw --batch-mode clean verify
      - name: Validate frontend
        working-directory: web/jack-en-poy-ai
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run lint
          npm run build
          npm audit --audit-level=high
      - name: Validate real service integration
        run: python scripts/smoke_test.py
