name: Validate

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/jack-en-poy-ai/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements-lock.txt
      - name: Install Python dependencies
        run: python -m pip install -r ml/requirements-lock.txt
      - name: Validate Python pipeline
        working-directory: ml
        run: |
          python -m pip check
          python -m pytest
          python -m src.dataset.main
          python train.py
          python predict.py ROCK PAPER SCISSORS
          python compare.py
          python retrain.py --history data/raw/game-history.csv --compare
          python analytics.py --history data/raw/game-history.csv
      - name: Validate and package backend
        working-directory: core/jack-en-poy-ai
        run: sh mvnw --batch-mode clean verify
      - name: Validate frontend and demo
        working-directory: web/jack-en-poy-ai
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run lint
          npm run build
          npm run build:demo
          npm audit --audit-level=high
      - name: Verify browser demo
        working-directory: web/jack-en-poy-ai
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: browser-preview
          path: web/jack-en-poy-ai/test-results/
          retention-days: 14
      - name: Validate real service integration
        run: python scripts/smoke_test.py
      - name: Package release artifacts
        run: python scripts/package_release.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-artifacts
          path: release/
          retention-days: 14

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build and verify Docker Compose
        run: python scripts/container_smoke.py
